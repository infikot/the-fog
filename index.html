<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ТУМАН — Текстовый Квест</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    
    <!-- Google Fonts & Material Symbols Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./bundle.css" />
  </head>
  <body>
    <!-- Atmospheric Ambient Background Layer -->
    <div id="game-bg" class="fog-bg-layer"></div>
    <div class="fog-vignette-layer"></div>
    <div class="fog-mist"></div>

    <!-- ======================================================== -->
    <!-- SCREEN 1: MAIN MENU (Cinematic Start)                    -->
    <!-- ======================================================== -->
    <section id="screen-menu">
      <div style="position:absolute;top:1rem;right:1rem;">
        <button id="menu-btn-sound" class="fog-btn-icon" title="Звук">
          <span class="material-symbols-outlined" id="menu-sound-icon">volume_up</span>
        </button>
      </div>

      <div class="menu-title-block">
        <h1 class="menu-game-title">ТУМАН</h1>
        <p class="menu-game-subtitle">Текстовая интерактивная новелла</p>
      </div>

      <div class="menu-buttons-list">
        <button id="menu-btn-continue" class="btn-menu-action primary" style="display:none;">
          <span>Продолжить</span>
        </button>
        <button id="menu-btn-start" class="btn-menu-action primary">
          <span>Новая игра</span>
        </button>
        <button id="menu-btn-settings" class="btn-menu-action">
          <span>Настройки</span>
        </button>
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- SCREEN 2: STORY & LOCATION CAROUSEL (Original Hub)       -->
    <!-- ======================================================== -->
    <section id="screen-hub" style="display:none;">
      <!-- Hub Header -->
      <div class="hub-header">
        <div>
          <div id="hub-ep-title" class="hub-episode-title">НАЗАРЕТ</div>
          <div id="hub-story-title" class="hub-story-subtitle">Глава 0</div>
        </div>
        <div>
          <button id="hub-btn-settings" class="fog-btn-icon" title="Настройки">
            <span class="material-symbols-outlined">settings</span>
          </button>
        </div>
      </div>

      <!-- Center Card Carousel -->
      <div class="hub-carousel-wrap">
        <div class="hub-card-box">
          <div class="hub-card-image-wrap" id="card-container">
            <!-- Dynamic Quest Card Image -->
          </div>
          <div class="hub-card-info">
            <div id="quest-name" class="hub-card-title">Вступление</div>
            <div id="quest-desc" class="hub-card-desc"></div>
            
            <div class="hub-card-nav-row">
              <button id="btn-prev-quest" class="btn-hub-arrow" title="Назад">‹</button>
              <div id="hub-action-container" style="flex:1;">
                <!-- Injected start quest button -->
              </div>
              <button id="btn-next-quest" class="btn-hub-arrow" title="Вперёд">›</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- SCREEN 3: QUEST STORYPLAY (Chat & Choices)               -->
    <!-- ======================================================== -->
    <section id="screen-quest" style="display:none;">
      <!-- Floating Top Bar -->
      <header class="fog-header">
        <div class="fog-header-left">
          <button id="quest-btn-menu" class="btn-header-back" title="Меню">
            МЕНЮ
          </button>
        </div>

        <!-- Morality Points: Clean Raw Numbers Without Boxes -->
        <div class="fog-points-bar">
          <div class="fog-point-item" title="Сила / Агрессия">
            <span id="points-red-val" class="point-val red">0</span>
          </div>
          <div class="fog-point-item" title="Рассудок / Мораль">
            <span id="points-blue-val" class="point-val blue">0</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:0.4rem;">
          <button id="quest-btn-inv" class="fog-btn-icon" title="Инвентарь">
            <span class="material-symbols-outlined">backpack</span>
          </button>
          <button id="quest-btn-sound" class="fog-btn-icon" title="Звук">
            <span class="material-symbols-outlined" id="quest-sound-icon">volume_up</span>
          </button>
        </div>
      </header>

      <!-- Main Quest Story Log -->
      <main class="fog-main">
        <div id="log-container">
          <!-- Text lines and choices injected dynamically -->
        </div>
      </main>

      <!-- Footer Controls -->
      <footer class="fog-footer">
        <div class="fog-footer-inner" id="controls-container">
          <!-- Choices / Next Step buttons -->
        </div>
      </footer>
    </section>

    <!-- ======================================================== -->
    <!-- MODALS: Inventory, Settings & Saves                      -->
    <!-- ======================================================== -->
    <div id="modal-inventory" class="fog-modal-backdrop" style="display:none;">
      <div class="fog-modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--color-fog-border);padding-bottom:0.75rem;margin-bottom:0.75rem;">
          <span class="fog-modal-title">Инвентарь</span>
          <button id="close-inventory" class="fog-close-btn">✕</button>
        </div>
        <div id="inventory-list" class="inventory-grid">
          <!-- Item Cards -->
        </div>
      </div>
    </div>

    <div id="modal-settings" class="fog-modal-backdrop" style="display:none;">
      <div class="fog-modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--color-fog-border);padding-bottom:0.75rem;margin-bottom:0.75rem;">
          <span class="fog-modal-title">Настройки</span>
          <button id="close-settings" class="fog-close-btn">✕</button>
        </div>

        <!-- Volume Sliders Section -->
        <div style="display:flex;flex-direction:column;gap:0.9rem;margin-bottom:1.25rem;">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:0.35rem;">
              <span style="color:var(--color-fog-text);">Звуки действий и кликов</span>
              <span id="val-sfx" style="color:var(--color-fog-gold);font-weight:600;">80%</span>
            </div>
            <input type="range" id="slider-sfx" min="0" max="100" value="80" class="fog-range-slider" />
          </div>

          <div>
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:0.35rem;">
              <span style="color:var(--color-fog-text);">Фоновый эмбиент</span>
              <span id="val-ambient" style="color:var(--color-fog-gold);font-weight:600;">35%</span>
            </div>
            <input type="range" id="slider-ambient" min="0" max="100" value="35" class="fog-range-slider" />
          </div>
        </div>

        <!-- Session & Saves Section -->
        <div style="border-top:1px solid var(--color-fog-border);padding-top:0.9rem;display:flex;flex-direction:column;gap:0.4rem;">
          <button id="btn-modal-menu" class="fog-modal-btn" style="color:var(--color-fog-gold);border-color:rgba(197,160,89,0.35);margin-bottom:0.4rem;">
            <span>Выйти в главное меню</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">home</span>
          </button>
          <div style="font-size:0.75rem;color:var(--color-fog-muted);margin-bottom:0.35rem;">
            Сохранение сессии и пройденных развилок:
          </div>
          <button id="btn-export" class="fog-modal-btn">
            <span>Экспорт сессии (JSON)</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">download</span>
          </button>
          <button id="btn-import" class="fog-modal-btn">
            <span>Импорт сохранения</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">upload</span>
          </button>
          <input type="file" id="file-input" accept=".json" style="display:none;" />
          <button id="btn-restart" class="fog-modal-btn" style="color:#f87171;border-color:rgba(239,68,68,0.3);margin-top:0.5rem;">
            <span>Начать заново с Пролога</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">refresh</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./bundle.js"></script>
  </body>
</html>
