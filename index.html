<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ТУМАН</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-fog-dark text-fog-text font-sans selection:bg-fog-gold/20 selection:text-fog-gold overflow-x-hidden min-h-screen relative flex flex-col justify-between">
    <!-- Atmospheric Ambient Background with Overlay -->
    <div id="game-bg" class="fixed inset-0 bg-cover bg-center transition-all duration-1000 z-0 scale-105 pointer-events-none opacity-40"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-fog-dark via-fog-dark/85 to-fog-dark/60 z-0 pointer-events-none"></div>

    <!-- Top Sticky Navigation Bar -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-fog-dark/70 border-b border-fog-border/50 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h1 class="text-base md:text-lg font-serif font-bold tracking-widest text-fog-gold uppercase">ТУМАН</h1>
        <span id="status-indicator" class="text-[10px] text-fog-muted tracking-wider uppercase ml-2 px-2 py-0.5 rounded bg-fog-surface/60 border border-fog-border/30">Эпизод</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="sound-toggle" title="Звук" class="p-2 rounded bg-fog-surface/80 hover:bg-fog-surface text-fog-muted hover:text-fog-gold border border-fog-border/40 text-xs transition">
          🔊
        </button>
        <button id="menu-toggle" title="Меню" class="px-3 py-1.5 rounded bg-fog-surface/80 hover:bg-fog-surface text-fog-text hover:text-fog-gold border border-fog-border/40 text-xs tracking-wider uppercase transition">
          Меню
        </button>
      </div>
    </header>

    <!-- Main Quest Story Log Screen -->
    <main class="relative z-10 flex-1 max-w-2xl w-full mx-auto px-4 py-6 flex flex-col justify-start">
      <div id="log-container" class="space-y-3 pb-8">
        <!-- Lines injected dynamically -->
      </div>
    </main>

    <!-- Sticky Bottom Controls Container -->
    <footer class="sticky bottom-0 z-20 backdrop-blur-lg bg-fog-dark/85 border-t border-fog-border/50 px-4 py-4 w-full">
      <div class="max-w-2xl mx-auto" id="controls-container">
        <!-- Choices / Next Step buttons -->
      </div>
    </footer>

    <!-- Settings & Save/Load Modal Dialog -->
    <div id="modal-menu" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
      <div class="bg-fog-surface border border-fog-border max-w-sm w-full rounded-lg p-6 shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-fog-border pb-3">
          <h2 class="text-base font-serif font-bold text-fog-gold tracking-wider uppercase">Управление прогрессом</h2>
          <button id="close-menu" class="text-fog-muted hover:text-fog-text text-sm">✕</button>
        </div>
        <p class="text-xs text-fog-muted leading-relaxed">
          Прогресс непрерывно сохраняется в локальной базе браузера (IndexedDB/localStorage). Вы можете экспортировать или импортировать файл сохранения в любой момент.
        </p>
        <div class="flex flex-col gap-2 pt-2">
          <button id="btn-export" class="w-full py-2.5 px-4 bg-fog-dark/60 hover:bg-fog-dark border border-fog-border/60 hover:border-fog-gold/60 rounded text-fog-text text-xs tracking-wider uppercase transition text-left flex justify-between">
            <span>Экспорт сохранения (JSON)</span>
            <span>💾</span>
          </button>
          <button id="btn-import" class="w-full py-2.5 px-4 bg-fog-dark/60 hover:bg-fog-dark border border-fog-border/60 hover:border-fog-gold/60 rounded text-fog-text text-xs tracking-wider uppercase transition text-left flex justify-between">
            <span>Импорт сохранения</span>
            <span>📂</span>
          </button>
          <input type="file" id="file-input" accept=".json" class="hidden" />
          <button id="btn-restart" class="w-full py-2.5 px-4 bg-red-950/30 hover:bg-red-950/60 border border-red-900/40 rounded text-red-300 text-xs tracking-wider uppercase transition text-left flex justify-between mt-2">
            <span>Начать заново</span>
            <span>⚠️</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
