<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ТУМАН</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
  </head>
  <body>
    <!-- Atmospheric Background Layers -->
    <div id="game-bg" style="position:fixed;inset:0;background-size:cover;background-position:center;transition:background-image 0.9s ease;z-index:0;opacity:0.35;pointer-events:none;"></div>
    <div class="fog-atmosphere"></div>
    <div class="fog-mist"></div>

    <!-- ======================================================== -->
    <!-- 1. MAIN MENU SCREEN (Shown on Launch)                    -->
    <!-- ======================================================== -->
    <section id="screen-menu">
      <div class="menu-title-block">
        <h1 class="menu-game-title">ТУМАН</h1>
        <div class="menu-game-subtitle">Интерактивная новелла</div>
      </div>

      <div class="menu-buttons-list">
        <button id="menu-btn-start" class="btn-menu-action primary">Начать игру</button>
        <button id="menu-btn-continue" class="btn-menu-action" style="display:none;">Продолжить</button>
        <button id="menu-btn-settings" class="btn-menu-action">Настройки</button>
      </div>

      <div style="position:absolute;bottom:1.5rem;font-size:0.65rem;color:var(--color-fog-muted);letter-spacing:0.1em;text-transform:uppercase;">
        Версия Web Port • Сохранение в кэше
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- 2. STORY / QUEST HUB SCREEN (Carousel & Cards)           -->
    <!-- ======================================================== -->
    <section id="screen-hub" style="display:none;">
      <div class="hub-header">
        <div>
          <div id="hub-ep-title" class="hub-episode-title">НАЗАРЕТ</div>
          <div id="hub-story-title" class="hub-story-subtitle">Глава 0</div>
        </div>
        <div style="display:flex;align-items:center;gap:0.4rem;">
          <button id="hub-btn-inv" class="fog-btn-icon" title="Инвентарь">
            <span class="material-symbols-outlined">backpack</span>
          </button>
          <button id="hub-btn-sound" class="fog-btn-icon" title="Звук">
            <span class="material-symbols-outlined" id="hub-sound-icon">volume_up</span>
          </button>
          <button id="hub-btn-menu" class="btn-header-back" title="Главное меню">
            <span class="material-symbols-outlined" style="font-size:1.1rem;">home</span>
          </button>
        </div>
      </div>

      <div class="hub-carousel-wrap">
        <div class="hub-card-box animate-fade-in" id="hub-card-box">
          <div class="hub-card-image-wrap">
            <img id="hub-card-img" class="hub-card-image" src="" alt="Локация" />
            <div style="position:absolute;top:0.75rem;right:0.75rem;padding:0.25rem 0.6rem;background:rgba(7,9,12,0.85);border-radius:4px;border:1px solid var(--color-fog-border);font-size:0.68rem;color:var(--color-fog-gold);text-transform:uppercase;letter-spacing:0.05em;" id="hub-card-status">
              Доступно
            </div>
          </div>
          <div class="hub-card-info">
            <h3 id="hub-card-title" class="hub-card-title">Название квеста</h3>
            <p id="hub-card-desc" class="hub-card-desc">Описание локации и точки исследования...</p>

            <div class="hub-card-nav-row">
              <button id="hub-btn-prev" class="btn-hub-arrow" title="Предыдущая локация">‹</button>
              <button id="hub-btn-start-quest" class="btn-hub-start">Исследовать ➔</button>
              <button id="hub-btn-next" class="btn-hub-arrow" title="Следующая локация">›</button>
            </div>
          </div>
        </div>

        <div id="hub-advance-box" style="margin-top:1.5rem;width:100%;max-width:420px;display:none;">
          <button id="hub-btn-advance-story" class="btn-menu-action primary" style="width:100%;">
            Перейти к следующей главе ➔
          </button>
        </div>
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- 3. ACTIVE QUEST SCREEN (Story Log & Dialog Choices)      -->
    <!-- ======================================================== -->
    <section id="screen-quest" style="display:none;">
      <header class="fog-header">
        <div class="fog-header-left">
          <button id="quest-btn-back-hub" class="btn-header-back" title="Назад в меню">‹ Меню</button>
          <span class="fog-title-small">ТУМАН</span>
        </div>

        <!-- Moral & Status Indicators (Red & Blue Points): Pure clean numbers -->
        <div class="fog-points-bar">
          <div class="fog-point-item" title="Сила / Агрессия">
            <span id="points-red-val" class="point-val red">0</span>
          </div>
          <div class="fog-point-item" title="Рассудок / Мораль">
            <span id="points-blue-val" class="point-val blue">0</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:0.4rem;">
          <button id="quest-btn-inv" class="fog-btn-icon" title="Инвентарь">
            <span class="material-symbols-outlined">backpack</span>
          </button>
          <button id="quest-btn-sound" class="fog-btn-icon" title="Звук">
            <span class="material-symbols-outlined" id="quest-sound-icon">volume_up</span>
          </button>
        </div>
      </header>

      <!-- Main Quest Story Log -->
      <main class="fog-main">
        <div id="log-container">
          <!-- Text lines and choices injected dynamically -->
        </div>
      </main>

      <!-- Footer Controls -->
      <footer class="fog-footer">
        <div class="fog-footer-inner" id="controls-container">
          <!-- Choices / Next Step buttons -->
        </div>
      </footer>
    </section>

    <!-- ======================================================== -->
    <!-- MODALS: Inventory, Settings & Saves                      -->
    <!-- ======================================================== -->
    <div id="modal-inventory" class="fog-modal-backdrop" style="display:none;">
      <div class="fog-modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--color-fog-border);padding-bottom:0.75rem;margin-bottom:0.75rem;">
          <span class="fog-modal-title">Инвентарь</span>
          <button id="close-inventory" class="fog-close-btn">✕</button>
        </div>
        <div id="inventory-list" class="inventory-grid">
          <!-- Item Cards -->
        </div>
      </div>
    </div>

    <div id="modal-settings" class="fog-modal-backdrop" style="display:none;">
      <div class="fog-modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--color-fog-border);padding-bottom:0.75rem;margin-bottom:0.75rem;">
          <span class="fog-modal-title">Настройки и сейвы</span>
          <button id="close-settings" class="fog-close-btn">✕</button>
        </div>
        <p style="font-size:0.78rem;color:var(--color-fog-muted);line-height:1.5;margin-bottom:0.75rem;">
          Экспортируйте сохранение активной сессии с историей всех выборов и развилок.
        </p>
        <div style="display:flex;flex-direction:column;gap:0.4rem;">
          <button id="btn-export" class="fog-modal-btn">
            <span>Экспорт сессии (JSON)</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">download</span>
          </button>
          <button id="btn-import" class="fog-modal-btn">
            <span>Импорт сохранения</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">upload</span>
          </button>
          <input type="file" id="file-input" accept=".json" style="display:none;" />
          <button id="btn-restart" class="fog-modal-btn" style="color:#f87171;border-color:rgba(239,68,68,0.3);margin-top:0.75rem;">
            <span>Начать заново с Пролога</span>
            <span class="material-symbols-outlined" style="font-size:1.15rem;">refresh</span>
          </button>
        </div>
      </div>
    </div>

    <link rel="stylesheet" href="./bundle.css" />
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
